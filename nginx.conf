# Reverse proxy in front of the three services.
#
# The site is no longer a folder of files: it is a Node process that renders
# each page from the CMS. nginx keeps the jobs nginx is good at — TLS
# termination upstream, the redirects from the old WordPress site, the security
# headers, caching the immutable assets — and hands everything else through.
#
# Why the CMS lives on its own subdomain: Payload serves its admin at /admin and
# its API at /api, and both are already taken on the main domain — /admin by the
# form inbox, /api by the site's preview and flush endpoints plus /api/form. A
# subdomain avoids rewriting any of those paths, and avoids Payload generating
# admin URLs that do not match where it is actually mounted.

map $host $robots_tag {
  lagniconsulting.ca "";
  default            "noindex, nofollow";
}

upstream site         { server site:4321; }
upstream cms          { server cms:3001; }
upstream form_service { server form-service:3000; }

server {
  listen 80;
  server_name www.lagniconsulting.ca;
  return 301 https://lagniconsulting.ca$request_uri;
}

# ───────────────────────────────────────────────── the website
server {
  listen 80 default_server;
  absolute_redirect off;
  server_tokens off;

  # CVs are posted here; the limit mirrors MAX_BODY in form-service/server.mjs.
  client_max_body_size 6m;

  gzip on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Not X-Frame-Options: SAMEORIGIN. Live Preview renders the site inside an
  # iframe on cms.lagniconsulting.ca, which is a different origin — that header
  # would block the preview entirely. frame-ancestors names the CMS and nothing
  # else, so framing stays refused to everyone but the editing tool.
  add_header Content-Security-Policy "frame-ancestors 'self' https://cms.lagniconsulting.ca" always;
  add_header X-Robots-Tag $robots_tag always;
  # The site loads no third-party script; widen this if analytics is ever added.
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

  # Legacy URLs from the previous site.
  rewrite ^/(jd-edwards|quickbooks|web-development)/?$     /erp-solutions/    permanent;
  rewrite ^/en/(jd-edwards|quickbooks)/?$                  /en/erp-solutions/ permanent;
  rewrite ^/(newcomer-support|recruitment|candidates|employers)/?$ /recrutement/ permanent;
  rewrite ^/about/?$                                       /a-propos/         permanent;
  rewrite ^/blog(/.*)?$                                    /ressources/       permanent;
  rewrite ^/fr(/.*)?$                                      /                  permanent;

  # Form submissions and the request inbox: the only paths that belong to
  # form-service. Everything else under /api/ is the site's own.
  location = /api/form {
    proxy_pass http://form_service;
    include /etc/nginx/proxy-common.conf;
  }

  location /admin/ {
    proxy_pass http://form_service;
    include /etc/nginx/proxy-common.conf;
  }

  # Hashed by Astro, so they can be cached forever.
  location /_astro/ {
    proxy_pass http://site;
    include /etc/nginx/proxy-common.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Images are not content-hashed, so they get a finite cache instead.
  location /assets/ {
    proxy_pass http://site;
    include /etc/nginx/proxy-common.conf;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    proxy_pass http://site;
    include /etc/nginx/proxy-common.conf;
  }
}

# ───────────────────────────────────────────────── the CMS
server {
  listen 80;
  server_name cms.lagniconsulting.ca;
  server_tokens off;

  # Media uploads go through here.
  client_max_body_size 32m;

  # An editing tool is never indexed, whatever the host.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    proxy_pass http://cms;
    include /etc/nginx/proxy-common.conf;
  }
}
