# Production server for the static build (see Dockerfile). Mirrors vercel.json.

# Only the real domain is indexable; the temp/preview hosts send noindex.
map $host $robots_tag {
  lagniconsulting.ca "";
  default            "noindex, nofollow";
}

server {
  listen 80;
  server_name www.lagniconsulting.ca;
  return 301 https://lagniconsulting.ca$request_uri;
}

server {
  listen 80 default_server;
  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Robots-Tag $robots_tag always;
  # The site loads no third-party script; widen this if analytics is ever added.
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

  # Legacy URLs from the previous site.
  rewrite ^/(jd-edwards|quickbooks|web-development)/?$     /erp-solutions/    permanent;
  rewrite ^/en/(jd-edwards|quickbooks)/?$                  /en/erp-solutions/ permanent;
  rewrite ^/(newcomer-support|recruitment|candidates|employers)/?$ /recrutement/ permanent;
  rewrite ^/about/?$                                       /a-propos/         permanent;
  rewrite ^/blog(/.*)?$                                    /ressources/       permanent;
  rewrite ^/fr(/.*)?$                                      /                  permanent;

  location /_astro/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Images are not content-hashed, so they get a finite cache instead.
  location /assets/images/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=2592000";
  }

  location / {
    # $uri/ lets nginx add the trailing slash (trailingSlash: 'always').
    try_files $uri $uri/ =404;
  }

  error_page 404 /404.html;
}
