[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ─────────────────────────────────────────────────────────────────────────────
# 301 redirects from the previous WordPress site.
#
# ⚠ REVIEW BEFORE LAUNCH. This map is derived from the page inventory in the
# cahier de refonte (§11 and §27). Confirm each old URL against the live site's
# sitemap or Search Console before going live, and add any path found there
# that is missing here. Redirect first, delete never.
# ─────────────────────────────────────────────────────────────────────────────

# JD Edwards — repositioned under ERP & Solutions
[[redirects]]
  from = "/jd-edwards"
  to = "/erp-solutions/"
  status = 301
  force = true

[[redirects]]
  from = "/en/jd-edwards"
  to = "/en/erp-solutions/"
  status = 301
  force = true

# QuickBooks — service no longer listed; send to the closest relevant page
[[redirects]]
  from = "/quickbooks"
  to = "/erp-solutions/"
  status = 301
  force = true

[[redirects]]
  from = "/en/quickbooks"
  to = "/en/erp-solutions/"
  status = 301
  force = true

# Web development — no longer a commercial offer
[[redirects]]
  from = "/web-development"
  to = "/erp-solutions/"
  status = 301
  force = true

# Newcomer support — recruitment now covers international hiring
[[redirects]]
  from = "/newcomer-support"
  to = "/recrutement/"
  status = 301
  force = true

# Legacy recruitment pages merged into the single recruitment page
[[redirects]]
  from = "/recruitment"
  to = "/recrutement/"
  status = 301
  force = true

[[redirects]]
  from = "/candidates"
  to = "/recrutement/"
  status = 301
  force = true

[[redirects]]
  from = "/employers"
  to = "/recrutement/"
  status = 301
  force = true

# Legacy top-level pages
[[redirects]]
  from = "/about"
  to = "/a-propos/"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/ressources/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/ressources/"
  status = 301
  force = true

# WordPress language prefix: the old site served French under /fr
[[redirects]]
  from = "/fr"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fr/*"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
