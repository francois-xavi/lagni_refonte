# Headers every proxied upstream needs. Included from nginx.conf.
#
# Without these the applications cannot tell who is asking or over which
# scheme: Astro's CSRF check compares the Origin against the host it believes
# it is serving, and form-service rate-limits per IP — behind a proxy both
# would see nginx instead of the visitor.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "";

# Rendering a page is a few milliseconds; a cold start or a slow CMS is not.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

proxy_buffering on;
